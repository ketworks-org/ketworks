# Netlify builds the site directly from the repository ("Import an existing project").
# Search engines find the site through robots.txt and the sitemap written by the build.
[build]
  command = "python3 -m pip install -r requirements.txt && npm test && KETWORKS_SOURCE_REF=$BRANCH python3 -m nqsbot.build"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"
  NPM_FLAGS = "--ignore-scripts"
