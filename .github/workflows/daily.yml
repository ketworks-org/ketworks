name: Daily arXiv proposals
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Minimum lookback in days (use for a backfill)'
        type: number
        default: 14
permissions:
  contents: read
concurrency:
  group: arxiv-proposals
  cancel-in-progress: false
jobs:
  discover:
    if: vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore discovery state
        uses: actions/cache/restore@v4
        with:
          path: .cache/nqs
          key: nqs-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nqs-discovery-
      - name: Discover and propose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ARXIV_CONTACT: ${{ vars.ARXIV_CONTACT }}
          GH_TOKEN: ${{ secrets.NQS_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 14 }}
        run: python -m nqsbot.collect --publish-prs --lookback-days "$LOOKBACK_DAYS"
      - name: Preserve successful paper processing even after a partial failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/nqs
          key: nqs-discovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain extraction and PR review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-proposals-${{ github.run_id }}
          path: .run/
          if-no-files-found: ignore
          retention-days: 30
