name: Preview site
# Deploys the built site to a Netlify site with a random hostname. The site is marked noindex;
# it is a private preview, not a publication. Requires secrets NETLIFY_AUTH_TOKEN and
# NETLIFY_SITE_ID and the repository variable PREVIEW_ENABLED=true. See README.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  preview:
    if: vars.PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Build (edit links point at the deployed branch)
        env:
          KETBOOK_SOURCE_REF: ${{ github.ref_name }}
        run: python -m nqsbot.build
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir dist --message "${{ github.ref_name }} ${{ github.sha }}"
