name: Deploy site
# Builds the site and uploads it to the Netlify project that serves ketworks.org. Netlify's free plan
# does not build private repositories owned by an organization, so the build runs here instead.
# Requires the secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID and the repository variable
# DEPLOY_ENABLED=true. Pages stay noindex until the project goes public. See README.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Build (edit links point at the deployed branch)
        env:
          KETWORKS_SOURCE_REF: ${{ github.ref_name }}
        run: python -m nqsbot.build
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir dist --message "${{ github.ref_name }} ${{ github.sha }}"
